<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LOOK BUSY – Shows</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== Shows Page Styles ===== */
    .calendar-container {
      max-width: 900px;
      margin: 20px auto;
      border: 2px solid hotpink;
      border-radius: 10px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }

    .show-list {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      border: 2px dashed hotpink;
      background: #111;
      border-radius: 10px;
    }

    .show-list .show {
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px dotted hotpink;
    }

    .show-list .show:last-child {
      border-bottom: none;
    }

    .show h3 {
      color: hotpink;
      margin-bottom: 5px;
    }

    .show p {
      color: white;
      font-size: 16px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <div id="sidebar">
    <nav class="sidebar-nav">
      <a href="index.html">Home</a>
      <a href="shows.html">Shows</a>
      <a href="gallery.html">Gallery</a>
    </nav>
  </div>

  <div id="main">
    <h2>Upcoming Shows</h2>

    <!-- Google Calendar Embed -->
    <div class="calendar-container">
      <iframe
        src="https://calendar.google.com/calendar/embed?src=lookbusymt%40gmail.com&ctz=America%2FDenver&mode=AGENDA&bgcolor=%23000000"
        frameborder="0"
        scrolling="no">
      </iframe>
    </div>

    <!-- Custom List of Shows -->
    <div class="show-list">
      <div class="show">
        <h3>March 30, 2026 – Elk's Lodge, Bubblegum Market</h3>
        <p>Doors open: 6PM | Show at: 9:30PM | Tickets: $10</p>
      </div>

      <div class="show">
        <h3>May 8, 2026 – Monk's Bar</h3>
        <p>Doors open: 9PM | Tickets: $15</p>
      </div>
    </div>

  </div>

</body>
</html>
